name: Build/Test

on: [push, pull_request]

env:
  BUILD_DIR: _build

jobs:

  build-and-test-unix:

    if:
      github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        build-type: [Release]

    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: latest
          environment-name: testing
          init-shell: >-
            bash
          create-args: >-
            make
            cmake
            cxx-compiler
            pkg-config
            bmi-cxx

      - name: Configure project
        run: |
          cmake $GITHUB_WORKSPACE -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX

      - name: Build and install project
        run: cmake --build ${{ env.BUILD_DIR }} --target install --config ${{ matrix.build-type }}

      - name: Run project tests
        run: ctest --test-dir ${{ env.BUILD_DIR }} -C ${{ matrix.build-type }} --output-on-failure -VV

  build-and-test-windows:

    if:
      github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: windows-latest

    env:
      LIBRARY_PREFIX: $env:CONDA_PREFIX\Library

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: latest
          environment-name: testing
          init-shell: powershell
          create-args: >-
            make
            cmake
            cxx-compiler
            pkg-config
            bmi-cxx

      - name: Configure, build, and install project
        run: |
          cmake -B ${{ env.BUILD_DIR }} -LA -G Ninja -DCMAKE_INSTALL_PREFIX="${{ env.LIBRARY_PREFIX }}" -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{ env.BUILD_DIR }} --target install --config Release

      - name: Run project tests
        run: ctest --test-dir ${{ env.BUILD_DIR }} -C Release -VV --output-on-failure -VV
