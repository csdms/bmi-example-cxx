name: Build/Test

on: [push, pull_request]

env:
  BUILD_DIR: _build

jobs:

  build-and-test-unix:

    if:
      github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: ${{ matrix.os }}

    defaults:
      run:
        shell: bash -l {0}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        build-type: [Release]

    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: latest
          environment-name: testing
          init-shell: >-
            bash
          create-args: >-
            make
            cmake
            cxx-compiler
            pkg-config
            bmi-cxx

      - name: Configure project
        run: |
          cmake $GITHUB_WORKSPACE -B ${{ env.BUILD_DIR }} \
            -DCMAKE_BUILD_TYPE=${{ matrix.build-type }} \
            -DCMAKE_INSTALL_PREFIX=$CONDA_PREFIX

      - name: Build and install project
        run: cmake --build ${{ env.BUILD_DIR }} --target install --config ${{ matrix.build-type }}

      - name: Run project tests
        run: ctest --test-dir ${{ env.BUILD_DIR }} -C ${{ matrix.build-type }} --output-on-failure -VV

  build-and-test-windows:

    if:
      github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository

    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/checkout@v7

      - uses: mamba-org/setup-micromamba@v3
        with:
          micromamba-version: latest
          environment-name: testing
          init-shell: powershell
          create-args: >-
            make
            cmake
            cxx-compiler
            pkg-config
            bmi-cxx

      - name: Make CMake build directory
        run: cmake -E make_directory build

      - name: Configure CMake (Windows)
        working-directory: ${{ github.workspace }}/build
        run: |
          & "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat" x86

          cmake ${{ github.workspace }} `
            -DCMAKE_INSTALL_PREFIX:PATH=$env:CONDA_PREFIX\Library `
            -DCMAKE_BUILD_TYPE=Release

      - name: Build and install
        working-directory: ${{ github.workspace }}/build
        run: cmake --build . --target install --config Release

      - name: Test
        working-directory: ${{ github.workspace }}/build
        run: ctest -C Release --output-on-failure -VV
